  <style id="lg-tv-optimizations">
    /* Fundo preto e eliminação de rolagem */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #000;

       ===================================================================== */
    html, body, * {
      scroll-behavior: auto !important;
      will-change: auto !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;

    /* Fundos escuros sólidos e nítidos no lugar do backdrop-filter blur */

    }

    .film-title {
      background: rgba(0, 0, 0, 0.78) !important;
    }

    /* Desativa animações infinitas pesadas de fundo/ícones/shimmer mantendo spinners úteis */
    .tv-login:before,
    .tv-login__bg:before,
    .tv-login__bg:after,
    .home-live-icon,
    .home-live-icon.tv,
    .lgstop,
    .live-solid,
    .sf-logo-wrap,

    .placeholder-glow .placeholder,
    .placeholder-wave,
    .progress-bar-animated {
      animation: none !important;
      transition: none !important;
      filter: none !important;
    }

    .tv-login:before {
      transform: none !important;
    }

    .tv-login__bg:before,
    .tv-login__bg:after {
      display: none !important;
    }

    /* Desativa animações de entrada com opacity:0 garantindo 100% de visibilidade */
    .streaming-row-wrap,

    .status-message__container,
    .fade-in-up {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;

    .nav-link,
    .btn,

    .carousel-item {

    /* Imagens sem filter:blur ou escala durante carregamento */

    }
